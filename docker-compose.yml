name: acp-pulse

services:
  receiver:
    build: ./receiver
    image: pulse-receiver:test
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"

  pulse:
    build: .
    image: pulse:test
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      PULSE_RECEIVER_URL: http://receiver:8090
      PGLITE_DATA_DIR: /data/pglite
      # Öffentliche Adresse, nur wenn der Proxy mitläuft. Leer lassen für localhost.
      PULSE_PUBLIC_HOST: ${PULSE_PUBLIC_HOST:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
    volumes:
      - pulse-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - receiver

  # Optional: docker compose --profile proxy up --build
  # Ports 80 und 443 müssen frei sein. Namen stehen in deploy/Caddyfile.
  caddy:
    image: caddy:2
    profiles: ["proxy"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - pulse
      - receiver

volumes:
  pulse-data:
  caddy-data:
  caddy-config:
