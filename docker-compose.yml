name: acp-pulse

services:
  receiver:
    build: ./receiver
    image: pulse-receiver:test
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"

  pulse:
    build: .
    image: pulse:test
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      PULSE_RECEIVER_URL: http://receiver:8090
    depends_on:
      - receiver
